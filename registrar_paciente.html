<!DOCTYPE html>
<html lang="es">
   <!-- Control de versiones - Semana 4 Procesos Informáticos --> 
<head>
    <meta charset="UTF-8">
    <title>Registro de Paciente</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2 class="text-center">Registro de Pacientes - Área de Traumatología</h2>

    <form action="guardar_paciente.php" method="POST" class="p-4 bg-white shadow rounded">
        <div class="row mb-3">
            <div class="col-md-6">
                <label class="form-label">Nombre:</label>
                <input type="text" name="nombre" class="form-control" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Apellido:</label>
                <input type="text" name="apellido" class="form-control" required>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-4">
                <label class="form-label">Identificación:</label>
                <input type="text" name="identificacion" class="form-control" required>
            </div>
            <div class="col-md-4">
                <label class="form-label">Sexo:</label>
                <select name="sexo" class="form-select">
                    <option>Masculino</option>
                    <option>Femenino</option>
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label">Teléfono:</label>
                <input type="tel" name="telefono" class="form-control" required>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Dirección:</label>
            <input type="text" name="direccion" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Correo electrónico:</label>
            <input type="email" name="correo" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Motivo de la consulta:</label>
            <textarea name="motivo" class="form-control" rows="3" required></textarea>
        </div>

        <button type="submit" class="btn btn-success w-100">Registrar Paciente</button>
    </form>
</div>

</body>
</html>
