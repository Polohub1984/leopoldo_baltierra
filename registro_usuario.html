<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Usuario Administrativo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2 class="text-center">Registro de Usuario Administrativo</h2>
    <form action="guardar_usuario.php" method="POST" class="p-4 bg-white shadow rounded">
        <!-- Usuario: máximo 10 caracteres, mayúsculas -->
        <div class="mb-3">
            <label for="usuario" class="form-label">Usuario (máx. 10 caracteres, en mayúsculas):</label>
            <input type="text" name="usuario" id="usuario" class="form-control" maxlength="10" style="text-transform:uppercase;" required>
        </div>

        <!-- Clave: mínimo 8 caracteres, minúsculas -->
        <div class="mb-3">
            <label for="clave" class="form-label">Clave (mín. 8 caracteres, en minúsculas):</label>
            <input type="password" name="clave" id="clave" class="form-control" minlength="8" pattern="[a-z]{8,}" required>
        </div>

        <button type="submit" class="btn btn-primary w-100">Registrar Usuario</button>
    </form>
</div>

</body>
</html>
